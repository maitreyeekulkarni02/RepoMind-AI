[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = "-v"

pythonpath = [
    "."
]


[tool.black]
line-length = 88
target-version = ["py312"]


[tool.ruff]
line-length = 88
target-version = "py312"
